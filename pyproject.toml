[project]
name = "open-motorsport-engineer"
version = "0.0.0"
description = "Open Motorsport Engineer harness and application workspace"
requires-python = "==3.13.*"
dependencies = [
  "fastapi==0.140.3",
  "geographiclib==2.1",
  "python-multipart==0.0.32",
  "uvicorn==0.53.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
  ".venv",
  "fixtures",
  "frontend",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ome", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
