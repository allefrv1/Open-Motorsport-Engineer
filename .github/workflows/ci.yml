name: OME CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Harness verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          python-version: "3.13.15"
          enable-cache: true

      - name: Set up pnpm and Node
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          version: "11.27.1"
          runtime: "node@24.21.0"
          cache: true
          install: false

      - name: Sync Python environment
        run: uv sync --locked

      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile

      - name: Run canonical verification
        run: uv run --locked python scripts/harness.py verify

  containers:
    name: Container verification
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build container images
        run: docker compose build

      - name: Start container stack
        run: docker compose up --detach --wait --wait-timeout 90

      - name: Smoke-test API and web
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/healthz
          curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5173/api/v1/comparison-reports)" = "405"

      - name: Install pinned real-browser test runner
        run: |
          python3 -m venv .ci-playwright
          .ci-playwright/bin/python -m pip install --disable-pip-version-check playwright==1.57.0
          .ci-playwright/bin/python -m playwright install --with-deps chromium

      - name: Verify physical Traqmate flow in Chromium
        run: .ci-playwright/bin/python tests/browser/verify_ui.py

      - name: Preserve browser QA screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ome-ui-chromium-screenshots
          path: artifacts/ui/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop container stack
        if: always()
        run: docker compose down --volumes
